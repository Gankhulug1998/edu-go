<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Edu Go — Хятад ханз зургаар, түүхээр сур</title>
  <meta name="description" content="Хятад ханзыг бүтэц, зураг, түүхээр нь сур. 362 ханз, 2 түвшин — Duolingo шиг дулаан, аялал мэт зам." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --bg:#FBF8F4; --bg-tint:#F6F1EA;
      --surface:#FFFFFF; --surface-2:#FAF6F0; --surface-sunken:#F1EFEA;
      --border:#ECE4D8; --border-strong:#E0D5C5; --divider:#F1EBE1;
      --text:#1C1A17; --text-muted:#5B5B66; --text-soft:#82828E; --text-subtle:#A7A6AF;
      --primary:#F2A007; --primary-strong:#E08600; --primary-weak:#FEF3DC; --primary-soft:#FBF1E2;
      --primary-ring:rgba(242,160,7,.32); --primary-ink:#7A4E00;
      --brand:#5B57D1; --brand-hover:#4F4BC4; --brand-weak:#EEF0FB; --brand-soft:#F4F4FD;
      --brand-ring:rgba(91,87,209,.32); --brand-ink:#312E8A;
      --t1:#0E9F6E; --t1-weak:#DEF7EC; --t2:#5B57D1; --t2-weak:#EEF0FB; --t3:#D946A0; --t3-weak:#FBE8F4;
      --success:#15803C; --success-weak:#EFFAF1; --success-border:#BBF7D0;
      --danger:#B91C1C; --danger-weak:#FEF2F2; --danger-border:#FECACA;
      --ease-out:cubic-bezier(.22,1,.36,1);
    }
    *{ -webkit-tap-highlight-color:transparent; }
    body{ font-family:'Inter',-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif; background:var(--bg); color:var(--text); letter-spacing:-0.011em; }
    .han{ font-family:'Noto Serif SC','Source Han Serif','PingFang SC','Hiragino Sans GB',serif; }
    .hans{ font-family:'Noto Sans SC',sans-serif; }
    .mono{ font-family:ui-monospace,'JetBrains Mono',Menlo,monospace; font-variant-numeric:tabular-nums; }
    .btn{ display:inline-flex; align-items:center; justify-content:center; gap:.5rem; font-weight:600; border-radius:.75rem; transition:all .18s var(--ease-out); white-space:nowrap; cursor:pointer; }
    .btn:active{ transform:scale(.98); }
    .btn-primary{ height:2.75rem; padding:0 1.5rem; background:var(--primary); color:var(--text); box-shadow:0 8px 24px -8px rgba(242,160,7,.5); }
    .btn-primary:hover{ background:var(--primary-strong); }
    .btn-brand{ height:2.75rem; padding:0 1.5rem; background:var(--brand); color:#fff; }
    .btn-brand:hover{ background:var(--brand-hover); }
    .btn-ghost{ height:2.75rem; padding:0 1.25rem; border:1px solid var(--border-strong); color:var(--text); background:var(--surface); }
    .btn-ghost:hover{ background:var(--surface-2); }
    .btn-sm{ height:2.25rem; padding:0 1rem; border-radius:.625rem; }
    .field{ height:2.75rem; width:100%; border:1px solid var(--border-strong); background:var(--surface); border-radius:.75rem; padding:0 .875rem; font-size:14px; color:var(--text); transition:border-color .15s, box-shadow .15s; }
    .field::placeholder{ color:var(--text-subtle); }
    .field:focus{ outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-ring); }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:1rem; }
    .lift{ transition:transform .2s var(--ease-out), box-shadow .2s var(--ease-out); }
    .lift:hover{ transform:translateY(-4px); box-shadow:0 18px 40px -20px rgba(28,26,23,.28); }
    .eyebrow{ font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.14em; color:var(--brand-ink); }
    .chip{ display:inline-flex; align-items:center; gap:.375rem; border-radius:999px; padding:.25rem .75rem; font-size:12px; font-weight:600; }
    a{ color:inherit; }
    ::-webkit-scrollbar{ width:10px; height:10px; } ::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:99px; border:2px solid var(--bg); }
    @keyframes fadeUp{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }
    .fade-up{ animation:fadeUp .5s var(--ease-out) both; }
    @keyframes shimmer{ 0%{ background-position:-200% 0; } 100%{ background-position:200% 0; } }
    .skeleton{ background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-sunken) 37%,var(--surface-2) 63%); background-size:200% 100%; animation:shimmer 1.4s infinite; }
    .thumb-img{ opacity:0; transition:opacity .4s var(--ease-out), transform .4s var(--ease-out); transform:scale(1.03); }
    .thumb-img.loaded{ opacity:1; transform:none; }
    @keyframes pop{ 0%{ transform:scale(.6);} 60%{ transform:scale(1.18);} 100%{ transform:scale(1);} }
    .pop{ animation:pop .3s var(--ease-out); }
    @keyframes floatY{ 0%,100%{ transform:translateY(0) rotate(var(--rot,0)); } 50%{ transform:translateY(-7px) rotate(var(--rot,0)); } }
    .floaty{ animation:floatY 5.5s ease-in-out infinite; }
    .overlay{ animation:ovl .2s ease both; } @keyframes ovl{ from{opacity:0} to{opacity:1} }
    .panel-in{ animation:panel .24s var(--ease-out) both; } @keyframes panel{ from{opacity:0; transform:translateY(10px) scale(.97);} to{opacity:1; transform:none;} }
    @media (prefers-reduced-motion: reduce){ *{ animation:none!important; transition:none!important; } }
    [hidden]{ display:none!important; }
  </style>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: {
      sans:['Inter','-apple-system','Segoe UI','Arial','sans-serif'],
      han:['"Noto Serif SC"','serif'], hans:['"Noto Sans SC"','sans-serif'], mono:['ui-monospace','Menlo','monospace'],
    } } } };
  </script>
  <!-- Hanzi Writer: stroke-order animation + writing quiz (makemeahanzi dataset) -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
</head>
<body class="min-h-screen">

  <!-- ───────── NAV ───────── -->
  <nav id="nav" class="sticky top-0 z-40 h-14 border-b border-[var(--border)] bg-[var(--surface)]/85 backdrop-blur-md">
    <div class="max-w-6xl mx-auto h-full px-5 sm:px-8 flex items-center gap-3">
      <a href="#/" class="flex items-center gap-2 select-none mr-2">
        <span class="grid place-items-center w-7 h-7 rounded-[8px] bg-[var(--primary)] text-[var(--text)] shadow-[0_4px_10px_-4px_rgba(242,160,7,.6)]">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M8 3v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <span class="font-bold text-[17px] tracking-[-0.02em]">Edu Go</span>
      </a>
      <div class="hidden md:flex items-center gap-1 ml-2" id="nav-links"></div>
      <div class="flex-1"></div>
      <div id="nav-auth" class="flex items-center gap-2"></div>
      <button id="nav-burger" class="md:hidden grid place-items-center w-9 h-9 rounded-lg hover:bg-[var(--surface-2)]" aria-label="Цэс">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="mobile-menu" hidden class="md:hidden border-t border-[var(--border)] bg-[var(--surface)] px-5 py-3 space-y-1"></div>
  </nav>

  <main id="app"></main>
  <div id="modal-root"></div>
  <div id="toast-root" class="fixed bottom-5 inset-x-0 z-[60] flex flex-col items-center gap-2 pointer-events-none px-4"></div>

<script>
// ═══════════════════════════ STATE ═══════════════════════════
const S = { drafts: [], byChar: {}, packs: { levels: [], categories: [] }, user: null, progress: {}, googleAuth: false, freeLimit: 12, freeSet: new Set(), loaded: false };
const enc = encodeURIComponent;
const isUnlocked = (ch) => !!S.user || S.freeSet.has(ch);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (s, r=document) => r.querySelector(s);
const cardImg = (ch) => `/api/cards/${enc(ch)}/image`;

const LEVELS = [
  { id:1, slug:'anhan', name:'Анхан шат', tag:'HSK 1', color:'var(--t1)', weak:'var(--t1-weak)' },
  { id:2, slug:'dund',  name:'Дунд шат',  tag:'HSK 2', color:'var(--t2)', weak:'var(--t2-weak)' },
];

// ═══════════════════════════ API ═══════════════════════════
const api = {
  drafts: () => fetch('/api/drafts').then(r=>r.json()),
  packs:  () => fetch('/packs.json').then(r=>r.json()),
  me:     () => fetch('/api/auth/me').then(r=>r.json()).catch(()=>({user:null})),
  config: () => fetch('/api/auth/config').then(r=>r.json()).catch(()=>({google:false})),
  serverProgress: () => fetch('/api/me/progress').then(r=>r.ok?r.json():{progress:{}}).then(d=>d.progress||{}),
  draft:  (c) => fetch(`/api/cards/${enc(c)}`).then(r=>r.json()),
  login:  (b) => fetch('/api/auth/login',  { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b) }),
  signup: (b) => fetch('/api/auth/signup', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b) }),
  logout: () => fetch('/api/auth/logout', { method:'POST' }),
  setProg:(c,s) => fetch(`/api/me/progress/${enc(c)}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status:s}) }),
};

// ═══════════════════════════ PROGRESS ═══════════════════════════
const LS_KEY = 'edugo_progress';
function loadLocalProgress(){ try { return JSON.parse(localStorage.getItem(LS_KEY)||'{}'); } catch { return {}; } }
function saveLocalProgress(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S.progress)); } catch {} }
const statusOf = (ch) => S.progress[ch] || null;       // null | 'studied' | 'known'
const nextStatus = (s) => s===null ? 'studied' : s==='studied' ? 'known' : null;

async function cycleStatus(ch){
  const cur = statusOf(ch);
  const nxt = nextStatus(cur);
  if (nxt) S.progress[ch] = nxt; else delete S.progress[ch];
  if (S.user){ if (nxt) api.setProg(ch, nxt); else fetch(`/api/me/progress/${enc(ch)}`,{method:'DELETE'}); }
  else { saveLocalProgress(); if (cur===null) nudgeGuest(); }
  return statusOf(ch);
}
let nudged = false;
function nudgeGuest(){ if (nudged) return; nudged = true; toast('Явцаа үүрд хадгалахын тулд нэвтэрнэ үү', 'nudge'); }

function levelStats(levelId){
  const all = S.drafts.filter(d=>d.level===levelId);
  const known = all.filter(d=>statusOf(d.character)==='known').length;
  const seen  = all.filter(d=>statusOf(d.character)).length;
  return { total: all.length, known, seen };
}
function catStats(levelId, catSlug){
  const all = S.drafts.filter(d=>d.level===levelId && d.category===catSlug);
  return { total: all.length, known: all.filter(d=>statusOf(d.character)==='known').length };
}
const totalKnown = () => S.drafts.filter(d=>statusOf(d.character)==='known').length;

// ═══════════════════════════ ROUTER ═══════════════════════════
function parseRoute(){
  const h = location.hash.replace(/^#/, '') || '/';
  const [path, qs] = h.split('?');
  const q = Object.fromEntries(new URLSearchParams(qs||''));
  return { path, q };
}
function go(hash){ location.hash = hash; }
window.addEventListener('hashchange', render);

// ═══════════════════════════ RENDER ═══════════════════════════
function render(){
  if (!S.loaded) return;
  renderNav();
  const { path, q } = parseRoute();
  const app = $('#app');
  let html, after;
  if (path === '/' ) ({html, after} = viewHome());
  else if (path === '/learn') ({html, after} = viewLearn(q));
  else if (path === '/gallery') ({html, after} = viewGallery(q));
  else ({html, after} = viewHome());
  app.innerHTML = html;
  window.scrollTo({ top:0, behavior: location.hash.includes('card=')?'auto':'instant' });
  if (after) after();
  // deep-linked card modal
  if (q.card && S.byChar[q.card]) openCard(q.card);
  observeThumbs();
}

// ═══════════════════════════ NAV ═══════════════════════════
function renderNav(){
  const { path } = parseRoute();
  const link = (href,label) => {
    const active = (href==='#/learn' && path==='/learn') || (href==='#/gallery' && path==='/gallery');
    return `<a href="${href}" class="px-3 h-9 inline-flex items-center text-sm rounded-lg ${active?'text-[var(--text)] font-semibold':'text-[var(--text-muted)] hover:text-[var(--text)]'}">${label}</a>`;
  };
  $('#nav-links').innerHTML = link('#/learn','Сурах') + link('#/gallery','Картууд');
  const authEl = $('#nav-auth');
  if (S.user){
    const initial = (S.user.name||S.user.email||'?').trim()[0].toUpperCase();
    authEl.innerHTML = `
      <div class="hidden sm:flex chip bg-[var(--primary-weak)] text-[var(--primary-ink)]">★ ${totalKnown()} мэдсэн</div>
      <button id="acct-btn" class="grid place-items-center w-9 h-9 rounded-full bg-[var(--primary-weak)] text-[var(--primary-ink)] font-bold text-sm">${esc(initial)}</button>`;
    $('#acct-btn').onclick = openAccountMenu;
  } else {
    authEl.innerHTML = `
      <button class="btn btn-ghost btn-sm hidden sm:inline-flex" onclick="openAuth('login')">Нэвтрэх</button>
      <button class="btn btn-primary btn-sm" onclick="openAuth('signup')">Эхлэх</button>`;
  }
  // mobile menu
  $('#mobile-menu').innerHTML = ['<a href="#/learn" class="block h-12 flex items-center text-[15px] font-medium">Сурах</a>',
    '<a href="#/gallery" class="block h-12 flex items-center text-[15px] font-medium">Картууд</a>',
    S.user ? '<button onclick="doLogout()" class="block h-12 flex items-center text-[15px] font-medium text-[var(--danger)]">Гарах</button>'
           : '<button onclick="openAuth(\'login\')" class="btn btn-ghost w-full mt-2">Нэвтрэх</button><button onclick="openAuth(\'signup\')" class="btn btn-primary w-full mt-2">Үнэгүй эхлэх</button>'].join('');
}
$('#nav-burger').onclick = () => { const m=$('#mobile-menu'); m.hidden = !m.hidden; };
document.addEventListener('click', e=>{ if(!e.target.closest('#nav')) $('#mobile-menu').hidden=true; });

// ═══════════════════════════ COMPONENTS ═══════════════════════════
function progressRing(pct, color, size=64){
  const r = size/2 - 5, c = 2*Math.PI*r, off = c*(1-pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="-rotate-90">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-sunken)" stroke-width="5"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" style="transition:stroke-dashoffset .6s var(--ease-out)"/>
  </svg>`;
}
function thumb(ch, cls=''){
  return `<div class="relative w-full aspect-[4/3] bg-[var(--surface-2)] skeleton ${cls}">
    <img data-src="${cardImg(ch)}" alt="${esc(ch)}" loading="lazy" decoding="async" class="thumb-img absolute inset-0 w-full h-full object-cover object-top">
  </div>`;
}
function trackCard(lvl){
  const st = levelStats(lvl.id), pct = st.total? Math.round(st.known/st.total*100):0;
  const cats = S.packs.categories.filter(c=>S.drafts.some(d=>d.level===lvl.id&&d.category===c.slug));
  const icons = cats.slice(0,8).map(c=>`<span class="w-8 h-8 grid place-items-center rounded-lg bg-[var(--surface-2)] text-base">${c.icon||'•'}</span>`).join('');
  const more = cats.length>8 ? `<span class="w-8 h-8 grid place-items-center rounded-lg bg-[var(--surface-2)] text-xs font-semibold text-[var(--text-soft)]">+${cats.length-8}</span>`:'';
  return `<a href="#/gallery?level=${lvl.id}" class="card lift block p-5 sm:p-6 border-2" style="border-color:${pct>0?'var(--primary)':'var(--border)'}">
    <div class="flex items-start gap-4">
      <div class="relative shrink-0 grid place-items-center">${progressRing(pct, lvl.color)}<span class="absolute mono text-sm font-bold">${pct}%</span></div>
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full" style="background:${lvl.color}"></span><span class="eyebrow" style="color:${lvl.color}">${lvl.tag} · ${esc(lvl.name)}</span></div>
        <div class="text-lg font-bold tracking-[-0.01em] mt-0.5">${esc(lvl.name)}</div>
        <div class="mono text-sm text-[var(--text-soft)] mt-0.5">${st.known} / ${st.total} ханз мэдсэн</div>
      </div>
    </div>
    <div class="flex items-center gap-1.5 mt-4">${icons}${more}</div>
    <div class="flex items-center justify-between mt-4 pt-4 border-t border-[var(--divider)]">
      <span class="text-sm text-[var(--text-muted)]">${cats.length} ангилал</span>
      <span class="text-sm font-semibold text-[var(--primary-strong)]">${pct>0?'Үргэлжлүүлэх':'Эхлэх'} →</span>
    </div>
  </a>`;
}

// ═══════════════════════════ VIEW: HOME ═══════════════════════════
function viewHome(){
  const teaserCells = S.drafts.slice(0,6).map(d=>
    `<a href="#/gallery?card=${enc(d.character)}" class="card overflow-hidden lift block">${thumb(d.character)}</a>`).join('');
  const values = [
    ['🧩','Бүтцээр сур','木 + 木 = 林. Ханзыг хэсэг болгон задлаад л санана.'],
    ['📖','Санааны түүх','Монгол тайлбар, дүрс — цээжлэхэд хялбар, мартахад хэцүү.'],
    ['🌱','Явцаа хадга','Нэвтэрч "үзсэн / мэдсэн" тэмдэглээд цаашид үргэлжлүүл.'],
  ].map(([i,t,d])=>`<div class="card p-6 lift">
      <div class="w-12 h-12 grid place-items-center rounded-full bg-[var(--brand-weak)] text-xl">${i}</div>
      <h3 class="text-lg font-semibold mt-4">${t}</h3><p class="text-[15px] text-[var(--text-muted)] leading-[1.6] mt-1.5">${d}</p></div>`).join('');
  const steps = [['01','Зам сонго','HSK1 эсвэл HSK2 түвшнээ эхэл.'],['02','Картаар үз','Ангилал бүрийн ханзыг зураг, бүтэц, түүхээр.'],['03','Тэмдэглэ','"Мэдсэн" гэж тэмдэглээд цуглуулгаа өсгө.']]
    .map(([n,t,d])=>`<div class="flex-1"><div class="text-3xl font-bold text-[var(--primary)] mono">${n}</div><div class="text-lg font-semibold mt-2">${t}</div><div class="text-[15px] text-[var(--text-muted)] mt-1">${d}</div></div>`).join('<div class="hidden md:block self-center text-[var(--border-strong)]">·····</div>');

  const html = `
  <!-- HERO -->
  <section class="relative overflow-hidden">
    <div class="absolute inset-0 pointer-events-none" style="background:radial-gradient(60% 50% at 72% 0%, rgba(91,87,209,.10), transparent 70%)"></div>
    <div class="max-w-6xl mx-auto px-5 sm:px-8 py-14 sm:py-20 grid lg:grid-cols-[1.1fr_.9fr] gap-12 items-center relative">
      <div class="fade-up">
        <span class="chip bg-[var(--primary-weak)] text-[var(--primary-ink)]">✦ ${S.drafts.length} ханз · 2 түвшин</span>
        <h1 class="text-4xl sm:text-5xl lg:text-6xl font-bold tracking-[-0.025em] leading-[1.05] mt-5">Хятад ханзыг<br><span class="relative whitespace-nowrap">зургаар, түүхээр<span class="absolute left-0 -bottom-1 h-3 w-full -z-10" style="background:var(--primary-weak)"></span></span> сур.</h1>
        <p class="text-[16px] sm:text-lg text-[var(--text-muted)] leading-[1.6] mt-5 max-w-md">木 + 木 = 林. Бүтцийг нь хараад л санана. Duolingo шиг дулаан, аялал мэт зам.</p>
        <div class="flex flex-wrap gap-3 mt-7">
          <button class="btn btn-primary" onclick="${S.user?`go('#/learn')`:`openAuth('signup')`}">Үнэгүй эхлэх →</button>
          <a href="#/gallery" class="btn btn-ghost">Картууд үзэх</a>
        </div>
        <p class="text-[13px] text-[var(--text-soft)] mt-4">Бүртгэлгүй ч үзэж болно · Хадгалахын тулд нэвтэр.</p>
      </div>
      <div class="relative h-[300px] sm:h-[380px] hidden sm:block">
        <div class="absolute right-6 top-8 w-[78%] card overflow-hidden shadow-xl rotate-[4deg]" style="--rot:4deg">${thumb(S.drafts[1]?.character||'你')}</div>
        <div class="absolute left-0 top-0 w-[78%] card overflow-hidden shadow-2xl floaty -rotate-[3deg]" style="--rot:-3deg">${thumb(S.drafts[0]?.character||'林')}</div>
        <div class="absolute right-2 bottom-2 chip bg-[var(--primary-weak)] text-[var(--primary-ink)] shadow-lg text-sm"><span class="han">林</span> = ой</div>
      </div>
    </div>
  </section>

  <!-- TRACKS -->
  <section class="bg-[var(--bg-tint)] border-y border-[var(--border)]">
    <div class="max-w-6xl mx-auto px-5 sm:px-8 py-14 sm:py-16">
      <span class="eyebrow">Чиний зам</span>
      <h2 class="text-2xl sm:text-3xl font-bold tracking-[-0.02em] mt-1">Түвшингээ сонгоод эхэл</h2>

function viewGallery(q){
  const level = Number(q.level)||1;
  const lvl = LEVELS.find(l=>l.id===level)||LEVELS[0];
  const cat = q.cat||'';
  const status = q.status||'all';
  const query = (q.q||'').toLowerCase();
  // categories in this level
  const cats = S.packs.categories.filter(c=>S.drafts.some(d=>d.level===level&&d.category===c.slug));
  let items = S.drafts.filter(d=>d.level===level);
  if (cat) items = items.filter(d=>d.category===cat);
  if (query) items = items.filter(d=>d.character.includes(query)||(d.meaning||'').toLowerCase().includes(query)||(d.pinyin||'').toLowerCase().includes(query));
  if (status==='unseen') items = items.filter(d=>!statusOf(d.character));
  if (status==='studied') items = items.filter(d=>statusOf(d.character)==='studied');
  if (status==='known') items = items.filter(d=>statusOf(d.character)==='known');

  const setQ = (patch) => { const n={level, ...(cat?{cat}:{}), ...(status!=='all'?{status}:{}), ...(query?{q:query}:{}), ...patch}; Object.keys(n).forEach(k=>(n[k]===''||n[k]==null)&&delete n[k]); return '#/gallery?'+new URLSearchParams(n); };
  const lvlSeg = LEVELS.map(l=>`<a href="${'#/gallery?level='+l.id}" class="px-4 h-9 inline-flex items-center rounded-full text-sm font-medium ${l.id===level?'bg-[var(--surface)] shadow-sm text-[var(--text)]':'text-[var(--text-soft)]'}">${l.tag}</a>`).join('');
  const catRail = [`<a href="${setQ({cat:''})}" class="chip whitespace-nowrap ${!cat?'bg-[var(--brand-weak)] text-[var(--brand-ink)]':'bg-[var(--surface-2)] text-[var(--text-muted)]'}">Бүгд</a>`]
    .concat(cats.map(c=>`<a href="${setQ({cat:c.slug})}" class="chip whitespace-nowrap ${cat===c.slug?'bg-[var(--brand-weak)] text-[var(--brand-ink)]':'bg-[var(--surface-2)] text-[var(--text-muted)]'}">${c.icon||''} ${esc(c.name)}</a>`)).join('');
  const statusChips = [['all','Бүгд'],['unseen','Үзээгүй'],['studied','Үзсэн'],['known','Мэдсэн']]
    .map(([k,l])=>`<a href="${setQ({status:k})}" class="chip ${status===k?'bg-[var(--primary-weak)] text-[var(--primary-strong)]':'bg-[var(--surface-2)] text-[var(--text-muted)]'}">${l}</a>`).join('');

  const gate = (!S.user) ? `<div class="card p-4 sm:p-5 mb-5 flex flex-wrap items-center gap-3" style="background:var(--primary-soft);border-color:var(--primary-weak)">
      <span class="grid place-items-center w-10 h-10 rounded-xl bg-[var(--primary-weak)] text-[var(--primary-ink)] shrink-0"><svg width="18" height="18" viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M5 7V5a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.4"/></svg></span>
      <div class="flex-1 min-w-[200px]"><div class="font-semibold">Чи ${S.freeLimit} ханзыг үнэгүй үзэж байна</div><div class="text-sm text-[var(--text-muted)]">Бүх ${S.drafts.length} ханз, бичих дасгал, явцаа хадгалахын тулд нэвтэр.</div></div>
      <button class="btn btn-primary btn-sm" onclick="openAuth('signup')">Үнэгүй бүртгүүлэх →</button></div>` : '';
  const lockedCell = (d) => `<button onclick="openAuth('signup')" class="card overflow-hidden lift block text-left">
      <div class="w-full aspect-[4/3] bg-[var(--surface-2)] grid place-items-center relative">
        <span class="han text-4xl text-[var(--text-subtle)] blur-[3px] select-none">${esc(d.character)}</span>
        <span class="absolute grid place-items-center w-9 h-9 rounded-full bg-[var(--surface)] shadow text-[var(--text-soft)]"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M5 7V5a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.4"/></svg></span>
      </div>
      <div class="p-3 border-t border-[var(--divider)] text-[12px] font-medium text-[var(--text-soft)]">Нэвтэрч нээх</div></button>`;
  const grid = items.length ? items.map(d=>{
    if (!isUnlocked(d.character)) return lockedCell(d);
    const st = statusOf(d.character);
    const ring = st==='known'?'bg-[var(--success)] text-white border-[var(--success)]':st==='studied'?'border-[var(--primary)] text-[var(--primary-strong)]':'border-[var(--border-strong)] text-transparent';
    return `<div class="card overflow-hidden lift ${st==='known'?'opacity-80':''}" data-card="${esc(d.character)}">
      <button class="block w-full" onclick="openCard('${esc(d.character)}')">${thumb(d.character)}</button>
      <div class="flex items-center justify-between p-3 border-t border-[var(--divider)]">
        <div class="min-w-0"><span class="han text-lg">${esc(d.character)}</span> <span class="text-[13px] font-medium text-[var(--brand)]">${esc(d.pinyin)}</span>
          <div class="text-[12px] text-[var(--text-soft)] truncate">${esc(d.meaning)}</div></div>
        <button class="shrink-0 w-7 h-7 rounded-full border-2 grid place-items-center ${ring}" title="Төлөв" onclick="event.stopPropagation();toggleStatus('${esc(d.character)}',this)">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div></div>`;
  }).join('') : `<div class="col-span-full card p-12 text-center text-[var(--text-soft)]">Энэ шүүлтэд ханз алга. <a href="${setQ({status:'all',cat:'',q:''})}" class="text-[var(--brand)] font-medium">Цэвэрлэх</a></div>`;

  const html = `
  <div class="sticky top-14 z-20 bg-[var(--bg)]/90 backdrop-blur border-b border-[var(--border)]">
    <div class="max-w-[1400px] mx-auto px-5 sm:px-8 py-3 space-y-2.5">
      <div class="flex items-center gap-3 flex-wrap">
        <div class="inline-flex bg-[var(--surface-sunken)] p-1 rounded-full">${lvlSeg}</div>
        <div class="flex-1 min-w-[140px]"><input id="gal-search" class="field !h-9" placeholder="Ханз · пиньин · утга хайх" value="${esc(query)}"></div>
        <div class="hidden sm:flex items-center gap-1.5">${statusChips}</div>
        <span class="mono text-sm text-[var(--text-soft)]">${items.length} карт</span>
      </div>
      <div class="flex items-center gap-2 overflow-x-auto pb-1 -mb-1">${catRail}</div>
      <div class="flex sm:hidden items-center gap-1.5 overflow-x-auto">${statusChips}</div>
    </div>
  </div>
  <div class="max-w-[1400px] mx-auto px-5 sm:px-8 py-7">
    ${gate}
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-4">${grid}</div>
  </div>`;

  const after = () => {
    const s = $('#gal-search');
    if (s){ let t; s.oninput = e=>{ clearTimeout(t); t=setTimeout(()=>{ go(setQ({q:e.target.value})); setTimeout(()=>{ const el=$('#gal-search'); if(el){el.focus(); el.setSelectionRange(el.value.length,el.value.length);} },0); }, 280); }; }
  };
  return { html, after };
}

function writeTabHtml(ch){
  if(!S.user) return `<div class="p-8 sm:p-12 text-center">
    <div class="w-14 h-14 mx-auto grid place-items-center rounded-2xl bg-[var(--primary-weak)] text-[var(--primary-ink)]"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 20l4-1L19 8a2 2 0 0 0-3-3L5 16l-1 4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></div>

    <button class="btn btn-primary mt-5" onclick="openAuth('signup')">Нэвтрэх / Бүртгүүлэх</button></div>`;
  const s = S.byChar[ch] || {};
  return `<div class="p-4 sm:p-6 flex flex-col items-center">
    <div class="text-center mb-4"><span class="text-[var(--brand)] font-medium">${esc(s.pinyin||'')}</span> <span class="text-[var(--text-muted)]">· ${esc(s.meaning||'')}</span></div>

      <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 280 280"><g stroke="var(--border-strong)" stroke-width="1" stroke-dasharray="6 6">
        <line x1="140" y1="6" x2="140" y2="274"/><line x1="6" y1="140" x2="274" y2="140"/></g></svg>
      <div id="hw-target" class="absolute inset-0"></div>
    </div>
    <div id="hw-status" class="text-sm h-6 mt-3 text-[var(--text-soft)]"></div>
    <div class="flex gap-2">
      <button class="btn btn-ghost btn-sm" onclick="hwAnimate()">Дараалал үзүүлэх</button>
      <button class="btn btn-primary btn-sm" onclick="hwQuiz()">Бичиж дасгалла</button>
    </div>
    <p class="text-[12px] text-[var(--text-subtle)] mt-3">Зурлага бүрийг зөв дарааллаар нь зур.</p>
  </div>`;
}
function mountWriter(ch){
  const t=$('#hw-target'); if(!t||!window.HanziWriter)return; t.innerHTML='';
  try{
    hw = HanziWriter.create(t, ch, { width:280, height:280, padding:12,
      showCharacter:false, showOutline:true, showHintAfterMisses:2,
      strokeColor:'#1C1A17', outlineColor:'#E0D5C5', drawingColor:'#F2A007', highlightColor:'#5B57D1',
      strokeAnimationSpeed:1.1, delayBetweenStrokes:160,
      charDataLoader:(c,onLoad,onErr)=>fetch(`https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.1/${c}.json`).then(r=>{if(!r.ok)throw 0;return r.json();}).then(onLoad).catch(()=>{ const s=$('#hw-status'); if(s)s.textContent='Энэ ханзны зурлагын мэдээлэл олдсонгүй.'; onErr&&onErr(new Error('no data')); }) });
    setTimeout(hwAnimate, 200);
  }catch(e){ const s=$('#hw-status'); if(s)s.textContent='Алдаа гарлаа.'; }
}
function hwAnimate(){ if(hw){ const s=$('#hw-status'); if(s)s.textContent=''; hw.animateCharacter(); } }
function hwQuiz(){ if(!hw)return; const s=$('#hw-status');
  if(s)s.textContent='Эхний зурлагаас эхэл…';
  hw.quiz({ leniency:1.0, showHintAfterMisses:2,
    onMistake:(d)=>{ if(s)s.innerHTML=`<span class="text-[var(--danger)]">Буруу — зурлага ${d.strokeNum+1}-ийг дахин зур</span>`; },
    onCorrectStroke:(d)=>{ if(s)s.innerHTML=`<span class="text-[var(--success)]">Зөв! ${d.strokesRemaining} зурлага үлдлээ</span>`; },
    onComplete:(d)=>{ if(s)s.innerHTML=`<span class="text-[var(--success)] font-semibold">✓ Бүгд зөв бичигдлээ! (${d.totalMistakes} алдаа)</span>`;
      if(S.user && statusOf(modalChar)!=='known'){ S.progress[modalChar]='studied'; api.setProg(modalChar,'studied'); renderNav(); }
      toast('Сайн байна — ханзыг зөв бичлээ!','ok'); } });
}
function cardMetaHtml(data, sum){
  const cat = S.packs.categories.find(c=>c.slug===data.category);
  const parts = (data.structure?.parts||[]).map(p=>`<span class="han">${esc(p.char)}</span><span class="text-[12px] text-[var(--text-soft)]">(${esc(p.label)})</span>`).join(' <span class="text-[var(--text-subtle)]">+</span> ');
  const res = data.structure?.result;
  return `<div class="space-y-4 p-1">
    <div class="flex items-start gap-3">
      <span class="han text-6xl sm:text-7xl leading-none">${esc(data.character)}</span>
      <div class="pt-1"><div class="text-lg font-medium text-[var(--brand)]">${esc(data.pinyin)}</div><div class="text-[var(--text-muted)]">${esc(data.meaning)}</div></div>
    </div>
    <div class="flex flex-wrap gap-1.5">
      ${data.level?`<span class="chip bg-[var(--surface-2)] text-[var(--text-muted)]">HSK${data.level}</span>`:''}
      ${cat?`<span class="chip bg-[var(--brand-weak)] text-[var(--brand-ink)]">${cat.icon||''} ${esc(cat.name)}</span>`:''}
    </div>
    ${parts?`<div><div class="eyebrow mb-1.5">Бүтэц</div><div class="card p-3 bg-[var(--surface-2)] text-[15px] flex items-center gap-2 flex-wrap">${parts} <span class="text-[var(--text-subtle)]">=</span> <span class="han text-lg">${esc(res?.char||'')}</span><span class="text-[12px] text-[var(--text-soft)]">(${esc(res?.label||'')})</span></div></div>`:''}
    ${data.story?`<div><div class="eyebrow mb-1.5">Санааны түүх</div><div class="rounded-xl border-l-2 border-[var(--primary)] bg-[var(--primary-soft)] p-3.5 text-[15px] leading-[1.7] text-[var(--text-muted)]">${esc(data.story)}</div></div>`:''}
    ${data.example?.word?`<div><div class="eyebrow mb-1.5">Жишээ үг</div><div class="card p-3 bg-[var(--brand-soft)] flex items-baseline gap-2 flex-wrap"><span class="han text-xl">${esc(data.example.word)}</span><span class="text-[13px] font-medium text-[var(--brand)]">${esc(data.example.pinyin)}</span><span class="text-[var(--text-muted)]">— ${esc(data.example.translation)}</span></div></div>`:''}
  </div>`;
}
function updateKnownBtn(){ const b=$('#md-known'); if(!b)return; const known=statusOf(modalChar)==='known';
  b.innerHTML = known?'✓ Мэдсэн':'Мэдсэн гэж тэмдэглэх'; b.className=`btn btn-sm flex-1 sm:flex-none ${known?'btn-brand':'btn-primary'}`; }
async function markKnownNav(){ const cur=statusOf(modalChar); S.progress[modalChar]= cur==='known'?(delete S.progress[modalChar],undefined):'known';
  if(S.user){ if(statusOf(modalChar)==='known')api.setProg(modalChar,'known'); else fetch(`/api/me/progress/${enc(modalChar)}`,{method:'DELETE'}); } else { saveLocalProgress(); }
  updateKnownBtn(); renderNav(); }
function navCard(dir){ const idx=S.drafts.findIndex(d=>d.character===modalChar); const nx=S.drafts[idx+dir]; if(nx) openCard(nx.character); }
function closeCard(){ $('#modal-root').innerHTML=''; document.body.style.overflow=''; modalChar=null; hw=null;
  const r=parseRoute(); if(r.q.card){ const n={...r.q}; delete n.card; go('#/'+(r.path.replace(/^\//,''))+(Object.keys(n).length?'?'+new URLSearchParams(n):'')); } }
document.addEventListener('keydown', e=>{ if(!modalChar)return; if(e.key==='Escape')closeCard(); else if(e.key==='ArrowLeft')navCard(-1); else if(e.key==='ArrowRight')navCard(1); else if(e.key.toLowerCase()==='m')markKnownNav(); });

// ═══════════════════════════ AUTH MODAL ═══════════════════════════
function openAuth(mode='login'){
  const root = $('#modal-root');
  const g = S.googleAuth ? `<a href="/api/auth/google" class="btn btn-ghost w-full !h-11"><svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.6 9.2c0-.6-.05-1.18-.16-1.74H9v3.3h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.67-3.88 2.67-6.54z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.93v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7a5.4 5.4 0 0 1 0-3.4V4.97H.93a9 9 0 0 0 0 8.06l3.02-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .93 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z"/></svg>Google-ээр үргэлжлүүлэх</a><div class="flex items-center gap-3 my-3"><div class="flex-1 h-px bg-[var(--border)]"></div><span class="text-xs text-[var(--text-subtle)]">эсвэл</span><div class="flex-1 h-px bg-[var(--border)]"></div></div>` : '';
  root.innerHTML = `<div class="fixed inset-0 z-50 overlay grid place-items-center p-4" onclick="if(event.target===this)closeModal()" style="background:rgba(26,26,34,.5);backdrop-filter:blur(3px)">
    <div class="panel-in card w-full max-w-md p-7 shadow-2xl" onclick="event.stopPropagation()">
      <div class="flex items-center gap-2 mb-1"><span class="grid place-items-center w-7 h-7 rounded-lg bg-[var(--primary)] text-[var(--text)]"><svg width="14" height="14" viewBox="0 0 16 16"><path d="M3 8h10M8 3v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span class="font-bold text-lg">Edu Go</span></div>
      <h2 id="auth-title" class="text-2xl font-bold tracking-[-0.02em] mt-3">${mode==='signup'?'Бүртгүүлэх':'Тавтай морил'}</h2>
      <p class="text-[var(--text-muted)] text-[15px] mt-1">Явцаа хадгалж, ханз цуглуул.</p>
      <div class="mt-5">${g}</div>
      <form id="auth-form" class="space-y-3">
        <div id="name-row" ${mode==='signup'?'':'hidden'}><label class="text-sm font-medium text-[var(--text-muted)]">Нэр <span class="text-[var(--text-subtle)]">(заавал биш)</span></label><input name="name" class="field mt-1" placeholder="Таны нэр"></div>
        <div><label class="text-sm font-medium text-[var(--text-muted)]">Имэйл</label><input name="email" type="email" required class="field mt-1" placeholder="name@example.com"></div>
        <div><label class="text-sm font-medium text-[var(--text-muted)]">Нууц үг</label><input name="password" type="password" required minlength="6" class="field mt-1" placeholder="••••••••"></div>
        <div id="auth-err" hidden class="text-[13px] text-[var(--danger)] bg-[var(--danger-weak)] border border-[var(--danger-border)] rounded-lg px-3 py-2"></div>
        <button id="auth-submit" class="btn btn-primary w-full !h-11">${mode==='signup'?'Бүртгүүлэх':'Нэвтрэх'}</button>
      </form>
      <p class="text-sm text-[var(--text-muted)] text-center mt-4">
        <span id="auth-switch-q">${mode==='signup'?'Бүртгэлтэй юу?':'Шинэ хэрэглэгч үү?'}</span>
        <button class="text-[var(--brand)] font-semibold" onclick="openAuth('${mode==='signup'?'login':'signup'}')">${mode==='signup'?'Нэвтрэх':'Бүртгүүлэх'}</button>
      </p>
      <button class="absolute top-4 right-4 w-8 h-8 grid place-items-center rounded-lg text-[var(--text-soft)] hover:bg-[var(--surface-2)]" onclick="closeModal()">✕</button>
    </div></div>`;
  document.body.style.overflow='hidden';
  $('#auth-form').onsubmit = (e)=>submitAuth(e, mode);
}
async function submitAuth(e, mode){
  e.preventDefault();
  const f = e.target, btn=$('#auth-submit'), err=$('#auth-err');
  const body = { email:f.email.value.trim(), password:f.password.value, name:f.name?.value?.trim()||undefined };
  btn.disabled=true; btn.textContent='...'; err.hidden=true;
  try {
    const res = await (mode==='signup'?api.signup(body):api.login(body));
    const data = await res.json();
    if (!res.ok){ err.textContent=data.error||'Алдаа гарлаа'; err.hidden=false; btn.disabled=false; btn.textContent=mode==='signup'?'Бүртгүүлэх':'Нэвтрэх'; return; }
    S.user = data.user;
    // merge local progress to server
    const local = loadLocalProgress();
    for (const [ch,st] of Object.entries(local)){ if(!S.progress[ch]){ S.progress[ch]=st; api.setProg(ch,st); } }
    try{ localStorage.removeItem(LS_KEY); }catch{}
    S.progress = { ...S.progress, ...(await api.serverProgress()) };
    closeModal(); toast('Тавтай морил! Явц хадгалагдлаа', 'ok'); render();
  } catch(ex){ err.textContent='Сүлжээний алдаа'; err.hidden=false; btn.disabled=false; }
}
function openAccountMenu(){
  const root=$('#modal-root');
  root.innerHTML = `<div class="fixed inset-0 z-50" onclick="closeModal()"><div class="absolute right-4 top-14 panel-in card w-60 p-1.5 shadow-xl" onclick="event.stopPropagation()">
    <div class="px-3 py-2.5"><div class="font-semibold truncate">${esc(S.user.name||'Сурагч')}</div><div class="text-[13px] text-[var(--text-soft)] truncate">${esc(S.user.email)}</div></div>
    <div class="px-3 py-1.5 text-[13px] text-[var(--text-muted)] border-y border-[var(--divider)]">★ ${totalKnown()} мэдсэн · ${S.drafts.filter(d=>statusOf(d.character)).length} үзсэн</div>
    <a href="#/learn" onclick="closeModal()" class="block px-3 h-9 flex items-center text-sm rounded-lg hover:bg-[var(--surface-2)]">Сурах</a>
    <a href="#/gallery" onclick="closeModal()" class="block px-3 h-9 flex items-center text-sm rounded-lg hover:bg-[var(--surface-2)]">Картууд</a>
    <button onclick="doLogout()" class="w-full text-left px-3 h-9 flex items-center text-sm rounded-lg hover:bg-[var(--surface-2)] text-[var(--danger)]">Гарах</button>
  </div></div>`;
}
async function doLogout(){ await api.logout(); S.user=null; S.progress=loadLocalProgress(); closeModal(); render(); toast('Гарлаа','ok'); }
function closeModal(){ $('#modal-root').innerHTML=''; document.body.style.overflow=''; }

// ═══════════════════════════ TOAST ═══════════════════════════
function toast(msg, kind='ok'){
  const el=document.createElement('div');
  const c = kind==='nudge'?'bg-[var(--brand)] text-white':'bg-[var(--text)] text-[var(--surface)]';
  el.className=`pointer-events-auto ${c} px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium fade-up`;
  el.textContent=msg; $('#toast-root').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2800);
}

// ═══════════════════════════ LAZY THUMBS ═══════════════════════════
let io;
function observeThumbs(){
  io?.disconnect();
  io = new IntersectionObserver((ents)=>{ ents.forEach(en=>{ if(en.isIntersecting){ const img=en.target; img.src=img.dataset.src; img.onload=()=>{ img.classList.add('loaded'); img.parentElement.classList.remove('skeleton'); }; img.onerror=()=>img.parentElement.classList.remove('skeleton'); io.unobserve(img); } }); }, { rootMargin:'200px' });
  document.querySelectorAll('img[data-src]:not([src])').forEach(img=>io.observe(img));
}

// ═══════════════════════════ INIT ═══════════════════════════
async function init(){
  const [drafts, packs, me, config] = await Promise.all([api.drafts(), api.packs(), api.me(), api.config()]);
  S.drafts = drafts; S.byChar = Object.fromEntries(drafts.map(d=>[d.character,d]));
  S.packs = packs; S.user = me.user; S.googleAuth = !!config.google;
  S.freeLimit = config.freeLimit ?? 12; S.freeSet = new Set(S.drafts.slice(0, S.freeLimit).map(d=>d.character));
  S.progress = S.user ? await api.serverProgress() : loadLocalProgress();
  S.loaded = true;
  // google redirect feedback
  const p = parseRoute();
  if (p.q.auth==='ok' && S.user) toast('Тавтай морил!','ok');
  if (p.q.auth==='google_failed') toast('Google нэвтрэлт амжилтгүй','nudge');
  render();
}
init();
</script>
