name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' <<'SCRIPT'
          set -euo pipefail
          cd /opt/kanjimn
          git fetch origin main
          git reset --hard origin/main
          npm ci --no-audit --no-fund
          bash scripts/download-fonts.sh
          systemctl restart kanjimn
          for i in $(seq 1 15); do
            sleep 2
            curl -fsS http://localhost:3100/health >/dev/null && break
            [ "$i" = 15 ] && { echo "health check failed"; journalctl -u kanjimn -n 30 --no-pager; exit 1; }
          done
          # drafts.json өөрчлөлтийг DB рүү тусгана (is_done хадгалагдана)
          curl -fsS -X POST http://localhost:3100/api/admin/reseed
          echo "deploy OK"
          SCRIPT
